<svg xmlns="http://www.w3.org/2000/svg" width="480" height="668" viewBox="0 0 480 668" role="img" aria-labelledby="t"><title id="t">ARIA agent loop: chat message, FastAPI endpoint, Gemini function calling, server-side tools, reply; Gemini and the tools loop for up to five rounds</title>
<rect x="0.5" y="0.5" width="479" height="667" rx="14" fill="#ffffff" stroke="#d1d9e0"/>
<text x="22" y="40" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" letter-spacing="1.8" fill="#4f46e5">ARIA · AGENT LOOP</text>
<rect x="22" y="64" width="436" height="84" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="40" y="99" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#4f46e5">01</text>
<text x="74" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#1f2328">Chat message</text>
<text x="74" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15.5" fill="#59636e">Signed-in user, JWT verified</text>
<path d="M240.0 154 V172 m-5 -6 l5 6 l5 -6" fill="none" stroke="#4f46e5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="22" y="178" width="436" height="84" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="40" y="213" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#4f46e5">02</text>
<text x="74" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#1f2328">FastAPI endpoint</text>
<text x="74" y="240" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15.5" fill="#59636e">Per-user rate limit, conversation history</text>
<path d="M240.0 268 V286 m-5 -6 l5 6 l5 -6" fill="none" stroke="#4f46e5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="22" y="292" width="436" height="84" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="40" y="327" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#4f46e5">03</text>
<text x="74" y="328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#1f2328">Gemini</text>
<text x="74" y="354" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15.5" fill="#59636e">Function calling: picks a tool or answers</text>
<path d="M230.0 382 V400 m-5 -6 l5 6 l5 -6" fill="none" stroke="#4f46e5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M250.0 400 V382 m-5 6 l5 -6 l5 6" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="22" y="406" width="436" height="84" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="40" y="441" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#4f46e5">04</text>
<text x="74" y="442" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#1f2328">Server-side tools</text>
<text x="74" y="468" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15.5" fill="#59636e">Weather, news, crypto, GitHub activity</text>
<path d="M240.0 496 V514 m-5 -6 l5 6 l5 -6" fill="none" stroke="#4f46e5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="22" y="520" width="436" height="84" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="40" y="555" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#4f46e5">05</text>
<text x="74" y="556" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#1f2328">Reply</text>
<text x="74" y="582" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15.5" fill="#59636e">Stored with the chat in PostgreSQL</text>
<text x="22" y="634" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" fill="#59636e">Steps 03 and 04 repeat for up to five rounds,</text>
<text x="22" y="656" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" fill="#59636e">until the model answers without calling a tool.</text>
</svg>